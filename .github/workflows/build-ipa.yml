# =============================================================
# iOS IPA 自动构建工作流
# 使用方式：
#   1. 推送到 main 分支或手动触发
#   2. 工作流会自动用 macOS runner 编译
#   3. 下载生成的 IPA / .app 附件
#
# 签名说明：
#   - 免费 Apple ID: 构建成功但无法签名 → 下载 .app 自己签名后安装
#   - 付费开发者账号: 在 Settings → Secrets 添加以下内容：
#     - APPLE_DEVELOPER_EMAIL: Apple ID
#     - APPLE_APP_SPECIFIC_PASSWORD: Apple ID 专用密码
#     - APPLE_TEAM_ID: 团队 ID (选填)
# =============================================================

name: Build iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "SocialApp/**"
      - "project.yml"
      - "Package.swift"
  workflow_dispatch: # 手动触发

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APPLE_DEVELOPER_EMAIL: ${{ secrets.APPLE_DEVELOPER_EMAIL }}
  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode version: $(xcodebuild -version)"
          echo "Swift version: $(swift --version)"

      - name: 🔧 Install XcodeGen
        run: brew install xcodegen

      - name: 📐 Generate Xcode Project
        run: xcodegen generate
        working-directory: SocialApp-iOS

      # ===================== 构建 (Simulator) =====================
      - name: 🏗 Build for Simulator
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Debug \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build \
            | xcpretty --color && exit ${PIPESTATUS[0]}
        working-directory: SocialApp-iOS
        continue-on-error: true

      # ===================== 构建 (真机 - 需要 Apple 开发者账号) =====================
      - name: 🏗 Build for iOS Device
        env:
          APPLE_DEVELOPER_EMAIL: ${{ secrets.APPLE_DEVELOPER_EMAIL }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          XCODEBUILD_OPTS="CODE_SIGN_STYLE=Automatic COMPILER_INDEX_STORE_ENABLE=NO"

          # 如果有 Apple 开发者账号则尝试使用
          if [ -n "$APPLE_DEVELOPER_EMAIL" ]; then
            echo "Using Apple ID: $APPLE_DEVELOPER_EMAIL"
            XCODEBUILD_OPTS="$XCODEBUILD_OPTS DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}"
          fi

          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Release \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            $XCODEBUILD_OPTS \
            clean build \
            | xcpretty --color && exit ${PIPESTATUS[0]}
        working-directory: SocialApp-iOS
        continue-on-error: true

      # ===================== 导出 IPA（如果签名成功） =====================
      - name: 📦 Export IPA (if signed)
        run: |
          EXPORT_DIR="${{ runner.temp }}/export"
          mkdir -p "$EXPORT_DIR"

          # 查找 .app
          APP_PATH=$(find "${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No release .app found, skipping IPA export"
            exit 0
          fi

          echo "App found: $APP_PATH"

          # 检查是否有签名
          codesign -dv "$APP_PATH" 2>&1 && {
            echo "App is signed, exporting IPA..."
            mkdir -p "$EXPORT_DIR/Payload"
            cp -R "$APP_PATH" "$EXPORT_DIR/Payload/"
            cd "$EXPORT_DIR"
            zip -r SocialApp.ipa Payload/
            echo "IPA exported: SocialApp.ipa"
          } || {
            echo "App not signed, skipping IPA export (use .app with sideloadly)"
          }
        working-directory: SocialApp-iOS
        continue-on-error: true

      # ===================== 上传产物 =====================
      - name: 📤 Upload Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Simulator.app
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/SocialApp.app
          if-no-files-found: ignore

      - name: 📤 Upload Device .app (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Device.app
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/SocialApp.app
          if-no-files-found: ignore

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp.ipa
          path: |
            ${{ runner.temp }}/export/SocialApp.ipa
          if-no-files-found: ignore

      - name: 📤 Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/DerivedData/Logs/Build/*.log
          if-no-files-found: ignore