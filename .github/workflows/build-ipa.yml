name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"

      # Build for Simulator (no signing needed)
      - name: Build for Simulator
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Debug \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build
        continue-on-error: true

      # Build for iOS Device (auto-sign, may fail without Apple Developer account)
      - name: Build for iOS Device
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Release \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build
        continue-on-error: true

      # Show DerivedData structure for debugging
      - name: Debug File Structure
        run: |
          echo "=== runner.temp ==="
          echo "${{ runner.temp }}"
          echo ""
          echo "=== DerivedData contents ==="
          find "${{ runner.temp }}/DerivedData" -maxdepth 5 -type d 2>/dev/null | head -30 || echo "No DerivedData found"
          echo ""
          echo "=== Build Products search ==="
          find "${{ runner.temp }}/DerivedData" -name "*.app" -type d 2>/dev/null | head -10 || echo "No .app found"
          echo ""
          echo "=== Default DerivedData ==="
          find ~/Library/Developer/Xcode/DerivedData -maxdepth 3 -name "SocialApp*" -type d 2>/dev/null | head -5 || echo "No default DD"
        continue-on-error: true

      # Export IPA - find .app anywhere
      - name: Export IPA
        run: |
          APP_PATH=$(find "${{ runner.temp }}/DerivedData" -name "SocialApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SocialApp.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "No release .app found anywhere"
            exit 0
          fi

          echo "App found: $APP_PATH"
          EXPORT_DIR="${{ runner.temp }}/export"
          mkdir -p "$EXPORT_DIR/Payload"
          cp -R "$APP_PATH" "$EXPORT_DIR/Payload/"
          cd "$EXPORT_DIR"
          zip -r SocialApp.ipa Payload/
          echo "IPA created!"
        continue-on-error: true

      # Upload artifacts
      - name: Upload .app files
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-BuildOutput
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/**/SocialApp.app
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore