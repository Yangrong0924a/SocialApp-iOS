name: Build iOS IPA
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"

      # Build for Simulator (no signing needed)
      - name: Build for Simulator (Debug)
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Debug \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build

      # Build for iOS Device with automatic signing
      - name: Build for iOS Device (Release)
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Release \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build || echo "DEVICE_BUILD_FAILED=true" >> $GITHUB_ENV

      # Debug - show what was built
      - name: Find Build Products
        run: |
          echo "=== Looking for .app files ==="
          find "${RUNNER_TEMP}/DerivedData" -name "*.app" -type d 2>/dev/null || echo "No .app in RUNNER_TEMP"
          find ~/Library/Developer/Xcode/DerivedData -name "*.app" -type d 2>/dev/null || echo "No .app in default DerivedData"
          echo ""
          echo "=== DerivedData structure ==="
          find "${RUNNER_TEMP}/DerivedData" -maxdepth 5 -type d 2>/dev/null || echo "No DerivedData"

      # Export IPA - create unsigned IPA for testing
      - name: Export IPA
        run: |
          APP_PATH=$(find "${RUNNER_TEMP}/DerivedData" -name "SocialApp.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SocialApp.app" -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No SocialApp.app found anywhere!"
            exit 1
          fi
          echo "App found at: $APP_PATH"
          EXPORT_DIR="${RUNNER_TEMP}/export"
          mkdir -p "${EXPORT_DIR}/Payload"
          cp -R "$APP_PATH" "${EXPORT_DIR}/Payload/"
          cd "${EXPORT_DIR}"
          zip -r SocialApp.ipa Payload/
          ls -lh SocialApp.ipa

      # Upload artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-BuildOutput
          path: |
            ${{ runner.temp }}/DerivedData/Build/Products/**/SocialApp.app
            ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error