name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"

      # Build for Simulator (no signing needed)
      - name: Build for Simulator
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Debug \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build
        continue-on-error: true

      # Build for iOS Device (auto-sign, may fail without Apple Developer account)
      - name: Build for iOS Device
        run: |
          xcodebuild \
            -project SocialApp.xcodeproj \
            -scheme SocialApp \
            -configuration Release \
            -derivedDataPath "${{ runner.temp }}/DerivedData" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            clean build
        continue-on-error: true

      # Export IPA if Device build succeeded and app is signed
      - name: Export IPA
        run: |
          APP_PATH=$(find "${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No release .app found"
            exit 0
          fi

          echo "App found: $APP_PATH"
          EXPORT_DIR="${{ runner.temp }}/export"
          mkdir -p "$EXPORT_DIR/Payload"
          cp -R "$APP_PATH" "$EXPORT_DIR/Payload/"
          cd "$EXPORT_DIR"
          zip -r SocialApp.ipa Payload/
          echo "IPA created: $(du -h SocialApp.ipa | cut -f1)"
        continue-on-error: true

      # Upload artifacts
      - name: Upload Simulator .app
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Simulator.app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Debug-iphonesimulator/SocialApp.app
          if-no-files-found: ignore

      - name: Upload Device .app
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-Device.app
          path: ${{ runner.temp }}/DerivedData/Build/Products/Release-iphoneos/SocialApp.app
          if-no-files-found: ignore

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp.ipa
          path: ${{ runner.temp }}/export/SocialApp.ipa
          if-no-files-found: ignore