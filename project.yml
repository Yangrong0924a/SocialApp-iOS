# XcodeGen 项目配置
# 安装: brew install xcodegen
# 使用: cd SocialApp-iOS && xcodegen generate
name: SocialApp
options:
  bundleIdPrefix: com.socialapp
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"

targets:
  SocialApp:
    type: application
    platform: iOS
    sources:
      - path: SocialApp
        excludes:
          - "Resources/Assets.xcassets/AppIcon.appiconset"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.socialapp.ios
      INFOPLIST_FILE: SocialApp/Info.plist
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    info:
      path: SocialApp/Info.plist